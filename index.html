<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devil's Business</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="tela-jogo">

        <section class="cena">

            <!-- Balão de diálogo -->
            <div class="balao">
                <p id="fala"></p>
            </div>

            <!-- Personagem -->
            <img
                src="personagem.png"
                alt="Personagem"
                class="personagem"
            >

            <!-- Opções de diálogo -->
            <div id="opcoes" class="opcoes"></div>

        </section>

            <!-- ================================= -->
    <!-- PAINEL DE STATUS DO JOGO -->
    <!-- ================================= -->

    <aside id="painel-status" class="painel-status">

        <div class="status-item">

            <img src="dinheiro.png" alt="Dinheiro">

            <span class="status-nome">Dinheiro</span>

            <span class="status-valor">50</span>

        </div>


        <div class="status-item">

            <img src="associados.png" alt="Associados">

            <span class="status-nome">Associados</span>

            <span class="status-valor">50</span>

        </div>


        <div class="status-item">

            <img src="civis.png" alt="Civis">

            <span class="status-nome">Civis</span>

            <span class="status-valor">50</span>

        </div>


        <div class="status-item">

            <img src="policiais.png" alt="Policiais">

            <span class="status-nome">Policiais</span>

            <span class="status-valor">50</span>

        </div>

    </aside>

    </main>

</body>
</html>
