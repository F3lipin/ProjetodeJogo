<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devil's Business</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="tela-jogo">

        <section class="cena">

            <!-- Balão de diálogo -->
            <div class="balao">
                <p id="fala"></p>
            </div>

            <!-- Personagem -->
            <img
                src="imagens/personagem.png"
                alt="Personagem"
                class="personagem"
            >

            <!-- Opções de diálogo -->
            <div id="opcoes" class="opcoes"></div>

        </section>

        <section id="area-eventos" class="area-eventos" aria-live="polite">
            <div id="popup-evento" class="popup-evento" aria-labelledby="popup-titulo">
                <div class="popup-cabecalho">
                    <span>NOVO ACONTECIMENTO</span>
                    <span id="numero-dia">DIA 01</span>
                </div>
                <div class="popup-imagem" aria-label="Imagem do personagem">IMAGEM DO PERSONAGEM</div>
                <h2 id="popup-titulo"></h2>
                <p id="popup-texto"></p>
                <div class="popup-opcoes">
                    <button class="popup-opcao" id="opcao-esquerda" type="button">
                        <span id="texto-esquerda"></span>
                    </button>
                    <button class="popup-opcao" id="opcao-direita" type="button">
                        <span id="texto-direita"></span>
                    </button>
                </div>
            </div>
        </section>

            <!-- ================================= -->
    <!-- PAINEL DE STATUS DO JOGO -->
    <!-- ================================= -->

    <aside id="painel-status" class="painel-status">

        <div class="status-item">

            <img src="imagens/dinheiro.png" alt="Dinheiro">

            <span class="status-nome">Dinheiro</span>

            <span class="status-valor">50</span>

        </div>


        <div class="status-item">

            <img src="imagens/associados.png" alt="Associados">

            <span class="status-nome">Associados</span>

            <span class="status-valor">50</span>

        </div>


        <div class="status-item">

            <img src="imagens/civis.png" alt="Civis">

            <span class="status-nome">Civis</span>

            <span class="status-valor">50</span>

        </div>


        <div class="status-item">

            <img src="imagens/policiais.png" alt="Policiais">

            <span class="status-nome">Policiais</span>

            <span class="status-valor">50</span>

        </div>

    </aside>

    </main>

</body>
</html>
